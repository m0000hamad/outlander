# SNI-aware L4 front end (optional, `COMPOSE_PROFILES=ha`)
#
# Purpose: one public port, many backends, chosen by the TLS SNI name before any
# handshake is terminated. Useful when a single IP must serve several domains or
# when you want to hide where a domain actually terminates.
#
# Nothing here terminates TLS: certificates stay on the backends (3x-ui / sing-box).

global
    log stdout format raw local0
    maxconn 40000
    nbthread 4

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 2m
    timeout server 2m

frontend sni_router
    bind *:7443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # --- routing table -------------------------------------------------------
    # acl name req_ssl_sni -i <domain>
    acl cdn_ws      req_ssl_sni -i cdn.example.com
    acl reality     req_ssl_sni -i www.microsoft.com
    # acl second     req_ssl_sni -i second.example.com

    use_backend panel_tls   if cdn_ws
    use_backend reality_tls if reality
    # use_backend second_tls if second

    default_backend dead_end

backend panel_tls
    # 3x-ui VLESS/WS+TLS inbound. The panel runs in host networking, so the
    # docker bridge gateway (172.28.60.1) is the host itself.
    server edge 172.28.60.1:8443 check inter 3s fall 3 rise 2

backend reality_tls
    # REALITY terminates on the panel too, but SNI is not a REALITY match:
    # this backend exists so probes for a wrong SNI go somewhere harmless.
    server edge 172.28.60.1:443 check inter 3s fall 3 rise 2

backend dead_end
    # silently drop probes that do not carry a known SNI
    server nowhere 127.0.0.1:1 check

# Example: plain TCP port forward through the front end (no SNI involved).
# frontend raw_forward
#     bind *:7444
#     default_backend raw_target
#
# backend raw_target
#     server target 203.0.113.10:443 check
